<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mendiak</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#1f3d36">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mendiak">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:wght@400;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: una columna estrecha tipo libreta de cumbres; barra de pestañas fija abajo con botones grandes. */
:root {
  --bg: #f3f2ec;          /* papel de mapa */
  --surface: #ffffff;
  --surface-2: #e9ebe3;
  --ink: #1d2a26;
  --muted: #5d6b64;
  --line: #d8dbd0;
  --fir: #1f3d36;         /* verde abeto, como el Excel */
  --fir-ink: #ffffff;
  --ochre: #c86f1c;       /* ocre de baliza */
  --ochre-soft: #f7e3cc;
  --ok: #2f7d4f;
  --warn: #9a5b00;
  --warn-soft: #fff1cf;
  --font-display: "Barlow Condensed", "Arial Narrow", system-ui, sans-serif;
  --font-body: "Atkinson Hyperlegible", system-ui, -apple-system, "Segoe UI", sans-serif;
  --radius: 14px;
  --tab-h: 72px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #121a17; --surface: #1b2521; --surface-2: #24302b; --ink: #ecefe8; --muted: #a3b0a9;
    --line: #2f3c36; --fir: #2c5a4e; --fir-ink: #ffffff; --ochre: #f0a04b; --ochre-soft: #3a2a17;
    --ok: #6cc08e; --warn: #f2c36b; --warn-soft: #3a3018; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #121a17; --surface: #1b2521; --surface-2: #24302b; --ink: #ecefe8; --muted: #a3b0a9;
  --line: #2f3c36; --fir: #2c5a4e; --fir-ink: #ffffff; --ochre: #f0a04b; --ochre-soft: #3a2a17;
  --ok: #6cc08e; --warn: #f2c36b; --warn-soft: #3a3018; color-scheme: dark;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
input[type=search]::-webkit-search-cancel-button { -webkit-appearance: none; appearance: none; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body);
  font-size: 18px; line-height: 1.45; -webkit-text-size-adjust: 100%;
  padding-bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 24px);
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 30; background: var(--fir); }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--ochre); outline-offset: 2px; }
.wrap { max-width: 720px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }

/* cabecera */
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--fir); color: var(--fir-ink); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-block: 12px; }
.brand { font-family: var(--font-display); font-weight: 700; font-size: 30px; letter-spacing: .04em; text-transform: uppercase; line-height: 1; display: flex; align-items: center; gap: 10px; }
.brand svg { width: 30px; height: 22px; }
.pill { font-size: 14px; padding: 6px 12px; border-radius: 99px; background: rgba(255,255,255,.14); color: var(--fir-ink); border: 0; display: inline-flex; align-items: center; gap: 6px; }
.pill .dot { width: 9px; height: 9px; border-radius: 50%; background: #8fd6a8; }
.pill.pend .dot { background: #f6c177; }
.pill.off .dot { background: #e98a7a; }
.demo-banner { background: var(--ochre-soft); color: var(--ink); font-size: 15px; }
.demo-banner .wrap { padding-block: 8px; }

main { padding-top: 18px; }
.view { display: grid; gap: 18px; }
h2 { font-family: var(--font-display); font-weight: 600; font-size: 28px; text-transform: uppercase; letter-spacing: .03em; margin: 0; text-wrap: balance; }
h3 { font-family: var(--font-display); font-weight: 600; font-size: 21px; text-transform: uppercase; letter-spacing: .04em; margin: 0; color: var(--muted); }
.muted { color: var(--muted); }
.small { font-size: 15px; }

/* buscador */
.search { position: relative; }
.search input {
  width: 100%; font-size: 22px; padding: 16px 52px 16px 54px; border-radius: var(--radius);
  border: 2px solid var(--line); background: var(--surface); color: var(--ink);
}
.search input:focus { border-color: var(--ochre); outline: none; }
.search svg { position: absolute; left: 18px; top: 50%; translate: 0 -50%; width: 24px; height: 24px; color: var(--muted); }
.search .clear { position: absolute; right: 8px; top: 50%; translate: 0 -50%; width: 44px; height: 44px; border: 0; border-radius: 50%; background: var(--surface-2); font-size: 22px; line-height: 1; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); background: var(--surface); border-radius: 99px; padding: 8px 14px; font-size: 16px; min-height: 44px; }
.chip.on { background: var(--fir); border-color: var(--fir); color: var(--fir-ink); }
.chip small { color: inherit; opacity: .7; margin-left: 4px; }

/* resumen de búsqueda */
.summary { background: var(--fir); color: var(--fir-ink); border-radius: var(--radius); padding: 18px; display: grid; gap: 12px; }
.summary .big { font-family: var(--font-display); font-size: 40px; font-weight: 700; line-height: 1; }
.summary .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 10px 16px; }
.summary .k { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; opacity: .75; }
.summary .v { font-size: 18px; font-weight: 700; }

/* lista de salidas */
.year { font-family: var(--font-display); font-size: 22px; font-weight: 700; color: var(--ochre); margin-top: 6px; letter-spacing: .04em; }
.list { display: grid; gap: 10px; }
.card {
  text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 14px 16px; display: grid; grid-template-columns: 64px 1fr; gap: 4px 14px; align-items: start;
}
.card:active { background: var(--surface-2); }
.date { grid-row: span 3; text-align: center; border-right: 1px solid var(--line); padding-right: 12px; }
.date .d { font-family: var(--font-display); font-size: 32px; font-weight: 700; line-height: 1; }
.date .m { font-size: 14px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); }
.date .y { font-size: 13px; color: var(--muted); }
.card .t { font-weight: 700; font-size: 19px; line-height: 1.25; min-width: 0; overflow-wrap: anywhere; }
.card .meta { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 15px; color: var(--muted); }
.card .meta b { color: var(--ink); font-variant-numeric: tabular-nums; }
.card .who { font-size: 15px; color: var(--ink); min-width: 0; }
.tag { display: inline-block; font-size: 13px; padding: 2px 8px; border-radius: 6px; background: var(--surface-2); color: var(--ink); }
.tag.hi { background: var(--ochre-soft); color: var(--ink); }
mark { background: var(--ochre-soft); color: inherit; border-radius: 3px; padding: 0 2px; }
.empty { text-align: center; padding: 32px 12px; color: var(--muted); }
.more { justify-self: center; }

/* botones */
.btn { border: 0; border-radius: 12px; padding: 14px 20px; min-height: 52px; font-weight: 700; font-size: 18px; background: var(--surface-2); color: var(--ink); }
.btn.primary { background: var(--ochre); color: #fff; }
.btn.fir { background: var(--fir); color: var(--fir-ink); }
.btn.danger { background: transparent; color: #b23b2a; border: 2px solid currentColor; }
.btn.wide { width: 100%; }
.row { display: flex; flex-wrap: wrap; gap: 10px; }

/* formulario */
form { display: grid; gap: 16px; }
.field { display: grid; gap: 6px; align-content: start; }
.field label, .lbl { font-weight: 700; font-size: 16px; }
.field .hint { font-size: 14px; color: var(--muted); }
.field input, .field select, .field textarea {
  width: 100%; font-size: 20px; padding: 13px 14px; border: 2px solid var(--line); border-radius: 12px; background: var(--surface); color: var(--ink);
}
.field input:focus, .field textarea:focus, .field select:focus { border-color: var(--ochre); outline: none; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.two > * { min-width: 0; }
.suggest { display: grid; gap: 6px; }
.suggest button { text-align: left; border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 12px 14px; font-size: 18px; }
.suggest button span { color: var(--muted); font-size: 15px; }
.autofill { font-size: 15px; color: var(--ok); }
details.more-fields summary { cursor: pointer; font-weight: 700; color: var(--muted); padding: 8px 0; min-height: 44px; }
details.more-fields[open] > div { display: grid; gap: 16px; margin-top: 8px; }

/* montes */
.mrow { display: grid; grid-template-columns: 1fr auto; gap: 2px 12px; padding: 12px 4px; border-bottom: 1px solid var(--line); text-align: left; background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; }
.mrow .n { font-weight: 700; font-size: 18px; min-width: 0; overflow-wrap: anywhere; }
.mrow .c { font-family: var(--font-display); font-size: 26px; font-weight: 700; color: var(--ochre); grid-row: span 2; align-self: center; font-variant-numeric: tabular-nums; }
.mrow .s { font-size: 14px; color: var(--muted); }

/* resumen */
.kpis { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
.kpi { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; }
.kpi .v { font-family: var(--font-display); font-size: 38px; font-weight: 700; line-height: 1; font-variant-numeric: tabular-nums; }
.kpi .k { font-size: 14px; color: var(--muted); text-transform: uppercase; letter-spacing: .06em; }
.bars { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; align-items: end; height: 150px; padding-top: 18px; }
.bar { position: relative; background: var(--fir); border-radius: 6px 6px 0 0; min-height: 2px; }
.bar span { position: absolute; top: -20px; left: 0; right: 0; text-align: center; font-size: 13px; font-variant-numeric: tabular-nums; color: var(--ink); }
.bars-l { display: grid; grid-template-columns: repeat(12, 1fr); gap: 6px; font-size: 12px; color: var(--muted); text-align: center; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; display: grid; gap: 12px; }
.rank { display: grid; gap: 8px; }
.rank div { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.rank .meter { grid-column: 1 / -1; height: 6px; background: var(--surface-2); border-radius: 3px; overflow: hidden; }
.rank .meter i { display: block; height: 100%; background: var(--ochre); }

/* hoja de detalle */
.sheet-bg { position: fixed; inset: 0; background: rgba(10,20,16,.45); z-index: 40; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 41; background: var(--bg); border-radius: 20px 20px 0 0; max-height: 88vh; overflow: auto;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(24px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
.sheet .inner { max-width: 680px; margin: 0 auto; display: grid; gap: 14px; }
.kv { display: grid; grid-template-columns: 130px 1fr; gap: 8px 12px; font-size: 17px; }
.kv dt { color: var(--muted); }
.kv dd { margin: 0; min-width: 0; overflow-wrap: anywhere; }

/* pestañas */
nav.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 25; background: var(--surface); border-top: 1px solid var(--line);
  padding: 0 max(8px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(8px, env(safe-area-inset-left, 0px)); }
nav.tabs .in { max-width: 720px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); height: var(--tab-h); }
nav.tabs button { border: 0; background: none; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 14px; color: var(--muted); }
nav.tabs button svg { width: 26px; height: 26px; }
nav.tabs button.on { color: var(--fir); font-weight: 700; }
:root[data-theme="dark"] nav.tabs button.on { color: var(--ochre); }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) nav.tabs button.on { color: var(--ochre); } }
nav.tabs button.add { color: var(--ochre); }
nav.tabs button.add .plus { width: 46px; height: 46px; border-radius: 50%; background: var(--ochre); color: #fff; display: grid; place-items: center; margin-top: -18px; box-shadow: 0 4px 12px rgba(0,0,0,.18); }
nav.tabs button.add .plus svg { width: 26px; height: 26px; }

.toast { position: fixed; left: 50%; translate: -50% 0; bottom: calc(var(--tab-h) + env(safe-area-inset-bottom, 0px) + 16px); z-index: 50; background: var(--ink); color: var(--bg); padding: 12px 20px; border-radius: 12px; font-size: 17px; box-shadow: 0 6px 20px rgba(0,0,0,.2); max-width: calc(100% - 32px); }
.confirm { background: var(--warn-soft); border-radius: 12px; padding: 14px; display: grid; gap: 10px; }
@media (max-width: 420px) { .two { grid-template-columns: 1fr; } .kv { grid-template-columns: 1fr; gap: 2px; } .kv dd { margin-bottom: 8px; } }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up .22s ease-out; } @keyframes up { from { translate: 0 40px; opacity: .6; } } }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <div class="brand"><svg viewBox="0 0 30 22" aria-hidden="true"><path d="M1 21 11 5l5 8 4-5 9 13Z" fill="currentColor"/><path d="m11 5 3 5-3-1-2 2Z" fill="#f3f2ec"/></svg>Mendiak</div>
    <button class="pill" id="syncPill" type="button"><span class="dot"></span><span id="syncTxt">…</span></button>
  </div>
</header>
<div class="demo-banner" id="demoBanner" hidden><div class="wrap">Versión de prueba con los datos reales: lo que añadas o cambies aquí no se guarda.</div></div>

<main class="wrap" id="app"></main>

<nav class="tabs" aria-label="Secciones">
  <div class="in">
    <button type="button" data-tab="buscar"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>Buscar</button>
    <button type="button" data-tab="nueva" class="add"><span class="plus"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg></span>Nueva</button>
    <button type="button" data-tab="montes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M2 20 9 7l4 7 3-4 6 10Z"/></svg>Montes</button>
    <button type="button" data-tab="resumen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Resumen</button>
  </div>
</nav>

<script>
'use strict';
/* ====================== datos y normalización ====================== */
const MESES = ['ene','feb','mar','abr','may','jun','jul','ago','sep','oct','nov','dic'];
const MESES_L = ['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIAS = ['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
const MODALIDADES = ['Monte a pie','Bici','Raquetas','Cascadas','Ruta / travesía','Sin cima'];
const store = {
  get(k, d) { try { const v = localStorage.getItem('mendiak.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('mendiak.' + k, JSON.stringify(v)); } catch (e) {} }
};
const S = { salidas: [], listas: null, pend: [], online: true, demo: false, cfg: store.get('cfg', null), tab: 'buscar', q: '', limit: 40, ultimaSync: null };

const sinTildes = s => String(s || '').normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase().trim();
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const proper = s => s.toLowerCase().replace(/(^|[\s(-])(\p{L})/gu, (m, a, b) => a + b.toUpperCase());
const num = x => { const n = typeof x === 'number' ? x : parseFloat(String(x).replace(',', '.')); return isFinite(n) ? n : null; };

let aliasComp = new Map(), aliasMonte = new Map(), aliasProv = new Map(), compSet = new Map();
function prepararListas() {
  const L = S.listas || { companeros: [], aliasComp: [], aliasMonte: [], aliasProv: [], provincias: [], propietario: 'Carlos' };
  aliasComp = new Map(L.aliasComp.map(([a, b]) => [sinTildes(a), b]));
  aliasMonte = new Map(L.aliasMonte.map(([a, b]) => [sinTildes(a), String(b).toUpperCase()]));
  aliasProv = new Map(L.aliasProv.map(([a, b]) => [sinTildes(a), b]));
  compSet = new Map(L.companeros.map(c => [sinTildes(c), c]));
}
function nombresDe(txt) {
  if (!txt) return [];
  let s = ' ' + String(txt).replace(/\s+/g, ' ') + ' ';
  s = s.replace(/ [yYeE] /g, ',').replace(/[.;]/g, ',');
  const out = [];
  for (let p of s.split(',')) {
    p = p.trim(); if (!p) continue;
    const k = sinTildes(p);
    const n = aliasComp.get(k) || compSet.get(k) || proper(p);
    if (!out.includes(n)) out.push(n);
  }
  return out;
}
function cumbreDe(monte) {
  const c = String(monte || '').toUpperCase().trim();
  const seps = [',', ' Y ', ' E ', ' O ', ' CON ', ' EN BICI', '(', '-'];
  let cut = c.length;
  for (const s of seps) { const i = c.indexOf(s); if (i > 0 && i < cut) cut = i; }
  const raw = c.slice(0, cut).trim();
  return aliasMonte.get(sinTildes(raw)) || raw;
}
function provDe(p) { const t = String(p || '').trim(); return aliasProv.get(sinTildes(t)) || t; }
/* cotas: acepta números, "1457, 1113" y valores antiguos tipo 1153.1133 (dos cotas pegadas) */
function cotasDe(vals) {
  const out = [];
  for (const v of vals) {
    if (v === '' || v == null) continue;
    if (typeof v === 'string') { v.split(/[^\d.]+/).map(x => x.replace(/\./g, '')).forEach(x => { const n = parseInt(x, 10); if (n >= 100 && n < 9000) out.push(n); }); continue; }
    const ent = Math.trunc(v), dec = v - ent;
    if (ent) out.push(ent);
    if (dec > 0.00001) { let a = Math.round(dec * 10000); if (a > 4500) a = Math.round(dec * 1000); if (a >= 100) out.push(a); }
  }
  return out;
}
function modalidadDe(s) {
  if (s.modalidad) return s.modalidad;
  const m = String(s.monte || '').toUpperCase();
  if (m.includes('ACCIDENTE')) return 'Evento';
  if (m.includes('NO LLEGAMOS') || m.includes('NO SUBIMOS')) return 'Sin cima';
  if (m.includes('BICI')) return 'Bici';
  if (m.includes('RAQUETA')) return 'Raquetas';
  if (m.includes('CASCADA')) return 'Cascadas';
  if (/CAMINO|TRAVES|SENDERISMO|PIRINEO POR|CARROS DE FUEGO|RUTA DEL|PLAZAOLA/.test(m) || (s.fechaFin && s.fecha && s.fechaFin > s.fecha)) return 'Ruta / travesía';
  return 'Monte a pie';
}
const CAMPOS = ['id','fecha','fechaFin','monte','sierra','provincia','cota1','cota2','cota3','cota4','cota5','km','salida','participantes','modalidad','idRuta','notas'];
function deFila(r) {
  const s = {}; CAMPOS.forEach((c, i) => s[c] = r[i] === null || r[i] === undefined ? '' : r[i]);
  s.fecha = String(s.fecha || '').slice(0, 10); s.fechaFin = String(s.fechaFin || '').slice(0, 10);
  return enriquecer(s);
}
function enriquecer(s) {
  s.cotas = cotasDe([s.cota1, s.cota2, s.cota3, s.cota4, s.cota5]);
  s.cumbre = cumbreDe(s.monte);
  s.nombres = nombresDe(s.participantes);
  s.mod = modalidadDe(s);
  s.prov = provDe(s.provincia);
  s.altMax = s.cotas.length ? Math.max(...s.cotas) : null;
  s.texto = sinTildes([s.monte, s.cumbre, s.sierra, s.prov, s.salida, s.notas, s.nombres.join(' ')].join(' | '));
  return s;
}
function referencia() {
  // datos de la última vez de cada cumbre: sierra, provincia, cota, salida
  const ref = new Map();
  const orden = [...S.salidas].sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
  for (const s of orden) {
    const r = ref.get(s.cumbre) || { veces: 0 };
    r.veces++; r.ultima = s.fecha; if (!r.primera) r.primera = s.fecha;
    if (s.sierra) r.sierra = s.sierra; if (s.prov) r.prov = s.prov; if (s.cotas[0]) r.cota = s.cotas[0];
    if (s.salida) r.salida = s.salida; r.nombre = s.cumbre; r.alt = Math.max(r.alt || 0, s.altMax || 0);
    ref.set(s.cumbre, r);
  }
  return ref;
}
let REF = new Map();
function recalcular() {
  S.salidas.sort((a, b) => (b.fecha || '').localeCompare(a.fecha || '') || String(b.id).localeCompare(String(a.id)));
  REF = referencia();
}

/* ====================== fechas ====================== */
const hoyISO = () => { const d = new Date(); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
const fParts = iso => { const [y, m, d] = iso.split('-').map(Number); return { y, m, d, dt: new Date(y, m - 1, d) }; };
const fLarga = iso => { if (!iso) return 'sin fecha'; const p = fParts(iso); return `${DIAS[p.dt.getDay()]} ${p.d} de ${MESES_L[p.m - 1]} de ${p.y}`; };
const fCorta = iso => { if (!iso) return '—'; const p = fParts(iso); return `${p.d} ${MESES[p.m - 1]} ${p.y}`; };
const diasDesde = iso => Math.round((fParts(hoyISO()).dt - fParts(iso).dt) / 864e5);
const haceTxt = n => n === 0 ? 'hoy' : n === 1 ? 'ayer' : n < 60 ? `hace ${n} días` : n < 730 ? `hace ${Math.round(n / 30.4)} meses` : `hace ${Math.round(n / 365.25)} años`;
const fmtN = n => n == null ? '' : Number(n).toLocaleString('es-ES', { maximumFractionDigits: 1 });

/* ====================== conexión con Google ====================== */
function leerConfigDeEnlace() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.get('u') && h.get('k')) {
    S.cfg = { url: h.get('u'), k: h.get('k') }; store.set('cfg', S.cfg);
    history.replaceState(null, '', location.pathname + location.search);
  }
}
async function api(method, body) {
  const u = S.cfg.url + (method === 'GET' ? (S.cfg.url.includes('?') ? '&' : '?') + 'k=' + encodeURIComponent(S.cfg.k) : '');
  const r = await fetch(u, method === 'GET' ? { cache: 'no-store' } : { method: 'POST', body: JSON.stringify(Object.assign({ k: S.cfg.k }, body)) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error || 'Error');
  return j;
}
let sincronizando = false;
async function sincronizar(mostrar) {
  if (S.demo || !S.cfg || sincronizando) { pintarEstado(); return; }
  sincronizando = true; pintarEstado('sync');
  try {
    if (S.pend.length) { await api('POST', { ops: S.pend }); S.pend = []; store.set('pend', S.pend); }
    const j = await api('GET');
    S.listas = j.listas; prepararListas();
    const locales = S.salidas.filter(s => s._local);
    S.salidas = j.salidas.map(deFila).concat(locales.filter(l => !j.salidas.some(r => r[0] === l.id)));
    store.set('cache', { salidas: j.salidas, listas: j.listas, hora: j.hora });
    S.ultimaSync = new Date(); S.online = true; recalcular();
    if (mostrar) toast('Datos al día');
    render();
  } catch (e) {
    S.online = false;
    if (String(e.message).includes('CLAVE')) toast('La clave de conexión no es correcta. Revísala en Ajustes.');
    else if (mostrar) toast('Sin conexión. Lo guardado se enviará después.');
  }
  sincronizando = false; pintarEstado();
}
function encolar(op) {
  S.pend.push(op); store.set('pend', S.pend);
  if (!S.demo) sincronizar();
}
function pintarEstado(modo) {
  const p = document.getElementById('syncPill'), t = document.getElementById('syncTxt');
  p.classList.remove('pend', 'off');
  if (S.demo) { t.textContent = 'Prueba'; p.classList.add('pend'); return; }
  if (!S.cfg) { t.textContent = 'Sin conectar'; p.classList.add('off'); return; }
  if (modo === 'sync') { t.textContent = 'Actualizando…'; return; }
  if (S.pend.length) { t.textContent = S.pend.length + ' por enviar'; p.classList.add('pend'); return; }
  if (!S.online) { t.textContent = 'Sin conexión'; p.classList.add('off'); return; }
  t.textContent = 'Al día';
}

/* ====================== utilidades de interfaz ====================== */
const $ = s => document.querySelector(s);
let toastT;
function toast(msg) {
  let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; el.setAttribute('role', 'status'); document.body.appendChild(el); }
  el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3200);
}
function resaltar(texto, q) {
  const t = esc(texto); if (!q) return t;
  const qn = sinTildes(q); if (qn.length < 2) return t;
  const base = sinTildes(texto); const i = base.indexOf(qn);
  if (i < 0) return t;
  const raw = String(texto);
  return esc(raw.slice(0, i)) + '<mark>' + esc(raw.slice(i, i + qn.length)) + '</mark>' + esc(raw.slice(i + qn.length));
}
function tarjeta(s, q) {
  const p = s.fecha ? fParts(s.fecha) : null;
  const meta = [];
  if (s.altMax) meta.push(`<span><b>${fmtN(s.altMax)}</b> m</span>`);
  if (num(s.km)) meta.push(`<span><b>${fmtN(num(s.km))}</b> km</span>`);
  if (s.sierra) meta.push(`<span>${resaltar(s.sierra, q)}</span>`);
  if (s.mod && s.mod !== 'Monte a pie') meta.push(`<span class="tag hi">${esc(s.mod)}</span>`);
  if (s._local) meta.push(`<span class="tag">pendiente de enviar</span>`);
  const who = s.nombres.filter(n => n !== S.listas?.propietario);
  return `<button type="button" class="card" data-id="${esc(s.id)}">
    <div class="date">${p ? `<div class="d">${p.d}</div><div class="m">${MESES[p.m - 1]}</div><div class="y">${p.y}</div>` : '<div class="m">sin fecha</div>'}</div>
    <div class="t">${resaltar(s.monte, q)}</div>
    <div class="meta">${meta.join('')}</div>
    <div class="who">${who.length ? 'Con ' + resaltar(who.join(', '), q) : (s.nombres.length ? '<span class="muted">Solo</span>' : '')}</div>
  </button>`;
}
function listaPorAnios(arr, q) {
  let html = '', y = null;
  for (const s of arr) {
    const yy = s.fecha ? s.fecha.slice(0, 4) : 'Sin fecha';
    if (yy !== y) { html += `<div class="year">${yy}</div>`; y = yy; }
    html += tarjeta(s, q);
  }
  return html;
}

/* ====================== vistas ====================== */
function render() {
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === S.tab));
  ({ buscar: vBuscar, nueva: () => vForm(null), montes: vMontes, resumen: vResumen, ajustes: vAjustes })[S.tab]();
  pintarEstado();
}
function irA(tab, q) { S.tab = tab; if (q !== undefined) { S.q = q; S.limit = 40; } render(); window.scrollTo(0, 0); }

/* ---- Buscar ---- */
function filtrar(q) {
  const qn = sinTildes(q);
  if (!qn) return S.salidas;
  const partes = qn.split(/\s+/).filter(Boolean);
  return S.salidas.filter(s => partes.every(p => s.texto.includes(p)));
}
function resumenBusqueda(q, res) {
  if (!q || !res.length) return '';
  const qn = sinTildes(q);
  const esMonte = [...REF.keys()].some(k => sinTildes(k) === qn);
  const persona = esMonte ? null : [...compSet.values()].find(c => sinTildes(c) === qn);
  const fechas = res.map(s => s.fecha).filter(Boolean).sort();
  const cuenta = new Map();
  if (persona) res.forEach(s => cuenta.set(s.cumbre, (cuenta.get(s.cumbre) || 0) + 1));
  else res.forEach(s => s.nombres.filter(n => n !== S.listas?.propietario).forEach(n => cuenta.set(n, (cuenta.get(n) || 0) + 1)));
  const top = [...cuenta].sort((a, b) => b[1] - a[1]).slice(0, 3).map(([n, c]) => `${esc(persona ? proper(n) : n)} (${c})`).join(', ');
  const alt = Math.max(0, ...res.map(s => s.altMax || 0));
  const km = res.reduce((a, s) => a + (num(s.km) || 0), 0);
  const ult = fechas[fechas.length - 1];
  return `<section class="summary" aria-label="Resumen de la búsqueda">
    <div class="big">${res.length} ${res.length === 1 ? 'vez' : 'veces'}</div>
    <div class="grid">
      ${fechas.length ? `<div><div class="k">Primera</div><div class="v">${fCorta(fechas[0])}</div></div>
      <div><div class="k">Última</div><div class="v">${fCorta(ult)}</div><div class="small">${haceTxt(diasDesde(ult))}</div></div>` : ''}
      ${!persona && alt ? `<div><div class="k">Cota</div><div class="v">${fmtN(alt)} m</div></div>` : ''}
      ${km ? `<div><div class="k">Km anotados</div><div class="v">${fmtN(km)}</div></div>` : ''}
      ${top ? `<div style="grid-column:1/-1"><div class="k">${persona ? 'Montes más repetidos con ' + esc(persona) : 'Con quién más'}</div><div class="v">${top}</div></div>` : ''}
    </div></section>`;
}
function vBuscar() {
  const res = filtrar(S.q);
  const recientes = [...new Set(S.salidas.slice(0, 40).map(s => s.cumbre))].slice(0, 8);
  $('#app').innerHTML = `<div class="view">
    <div class="search">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="q" type="search" inputmode="search" autocomplete="off" placeholder="Monte, sierra o compañero…" aria-label="Buscar" value="${esc(S.q)}">
      <button class="clear" type="button" id="qClear" aria-label="Borrar búsqueda" ${S.q ? '' : 'hidden'}>×</button>
    </div>
    <div class="chips" id="recientes" ${S.q ? 'hidden' : ''}>${recientes.map(c => `<button type="button" class="chip" data-q="${esc(c)}">${esc(proper(c))}</button>`).join('')}</div>
    <div id="resultados"></div>
  </div>`;
  pintarResultados(res);
  const inp = $('#q');
  inp.addEventListener('input', () => { S.q = inp.value; S.limit = 40; $('#qClear').hidden = !S.q; $('#recientes').hidden = !!S.q; pintarResultados(filtrar(S.q)); });
  $('#qClear').onclick = () => { S.q = ''; vBuscar(); $('#q').focus(); };
  document.querySelectorAll('[data-q]').forEach(b => b.onclick = () => irA('buscar', b.dataset.q));
}
function pintarResultados(res) {
  const box = $('#resultados');
  if (!res.length) { box.innerHTML = `<div class="empty">No hay salidas con «${esc(S.q)}».<br>Prueba con una parte del nombre.</div>`; return; }
  const titulo = S.q ? '' : `<h3>Últimas salidas</h3>`;
  box.innerHTML = `<div class="list">${resumenBusqueda(S.q, res)}${titulo}${listaPorAnios(res.slice(0, S.limit), S.q)}
    ${res.length > S.limit ? `<button type="button" class="btn more" id="verMas">Ver más (${res.length - S.limit})</button>` : ''}</div>`;
  box.querySelectorAll('.card').forEach(c => c.onclick = () => detalle(c.dataset.id));
  const vm = $('#verMas'); if (vm) vm.onclick = () => { S.limit += 60; pintarResultados(res); };
}

/* ---- Detalle ---- */
function cerrarHoja() { document.querySelectorAll('.sheet,.sheet-bg').forEach(e => e.remove()); }
function detalle(id) {
  const s = S.salidas.find(x => String(x.id) === String(id)); if (!s) return;
  cerrarHoja();
  const bg = document.createElement('div'); bg.className = 'sheet-bg'; bg.onclick = cerrarHoja;
  const sh = document.createElement('div'); sh.className = 'sheet'; sh.setAttribute('role', 'dialog'); sh.setAttribute('aria-label', s.monte);
  const r = REF.get(s.cumbre);
  const filas = [
    ['Fecha', fLarga(s.fecha) + (s.fechaFin && s.fechaFin !== s.fecha ? ' → ' + fCorta(s.fechaFin) : '')],
    ['Cotas', s.cotas.length ? s.cotas.map(fmtN).join(' · ') + ' m' : ''],
    ['Km', num(s.km) ? fmtN(num(s.km)) : ''],
    ['Sierra', s.sierra], ['Provincia', s.prov], ['Salida desde', s.salida],
    ['Compañeros', s.nombres.join(', ')], ['Modalidad', s.mod], ['ID ruta', s.idRuta], ['Notas', s.notas]
  ].filter(f => f[1]);
  sh.innerHTML = `<div class="inner">
    <h2>${esc(s.monte)}</h2>
    ${r && r.veces > 1 ? `<button type="button" class="chip" id="dVer">Has estado ${r.veces} veces en ${esc(proper(s.cumbre))} · ver todas</button>` : ''}
    <dl class="kv">${filas.map(([k, v]) => `<dt>${k}</dt><dd>${esc(v)}</dd>`).join('')}</dl>
    <div class="row"><button type="button" class="btn fir" id="dEdit">Corregir</button><button type="button" class="btn" id="dClose">Cerrar</button></div>
    <div id="dDel"><button type="button" class="btn danger" id="dDelBtn">Borrar esta salida</button></div>
  </div>`;
  document.body.append(bg, sh);
  $('#dClose').onclick = cerrarHoja;
  $('#dEdit').onclick = () => { cerrarHoja(); S.tab = 'nueva'; document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('on', b.dataset.tab === 'nueva')); vForm(s); window.scrollTo(0, 0); };
  const dv = $('#dVer'); if (dv) dv.onclick = () => { cerrarHoja(); irA('buscar', proper(s.cumbre)); };
  $('#dDelBtn').onclick = () => {
    $('#dDel').innerHTML = `<div class="confirm"><b>¿Seguro que quieres borrar esta salida?</b><div class="row">
      <button type="button" class="btn danger" id="dYes">Sí, borrar</button><button type="button" class="btn" id="dNo">No</button></div></div>`;
    $('#dNo').onclick = () => detalle(id);
    $('#dYes').onclick = () => {
      S.salidas = S.salidas.filter(x => x !== s); recalcular();
      encolar({ accion: 'borrar', id: s.id }); cerrarHoja(); render(); toast('Salida borrada');
    };
  };
}

/* ---- Nueva / corregir ---- */
function companerosFrecuentes() {
  const c = new Map(); const desde = String(new Date().getFullYear() - 3);
  S.salidas.forEach(s => { if ((s.fecha || '') >= desde) s.nombres.forEach(n => c.set(n, (c.get(n) || 0) + 1)); });
  return [...c].sort((a, b) => b[1] - a[1]).map(x => x[0]);
}
function vForm(ed) {
  const borrador = ed ? null : store.get('borrador', null);
  const s = ed || borrador || { fecha: hoyISO(), participantes: S.listas?.propietario || '' };
  const elegidos = new Set(nombresDe(s.participantes));
  const frecuentes = companerosFrecuentes().slice(0, 18);
  elegidos.forEach(n => { if (!frecuentes.includes(n)) frecuentes.push(n); });
  const cotasTxt = ed ? (ed.cotas || []).join(', ') : (s.cotasTxt || '');
  $('#app').innerHTML = `<div class="view">
    <h2>${ed ? 'Corregir salida' : 'Nueva salida'}</h2>
    <form id="f" novalidate autocomplete="off">
      <div class="field"><label for="fFecha">Fecha</label><input id="fFecha" type="date" required value="${esc(s.fecha || '')}"></div>
      <div class="field"><label for="fMonte">Monte o ruta</label>
        <input id="fMonte" required placeholder="p. ej. Saioa y Okolin" value="${esc(s.monte || '')}">
        <div class="suggest" id="sug"></div><div class="autofill" id="auto" aria-live="polite"></div></div>
      <div class="two">
        <div class="field"><label for="fCotas">Cota (m)</label><input id="fCotas" inputmode="decimal" placeholder="1419, 1355" value="${esc(cotasTxt)}"><span class="hint">Si son varias, sepáralas con comas.</span></div>
        <div class="field"><label for="fKm">Km</label><input id="fKm" inputmode="decimal" placeholder="12,5" value="${esc(s.km ? String(s.km).replace('.', ',') : '')}"></div>
      </div>
      <div class="field"><span class="lbl">Compañeros</span>
        <div class="chips" id="comp">${frecuentes.map(n => `<button type="button" class="chip ${elegidos.has(n) ? 'on' : ''}" data-n="${esc(n)}" aria-pressed="${elegidos.has(n)}">${esc(n)}</button>`).join('')}</div>
        <input id="fOtros" placeholder="Otros (escribe y separa con comas)" aria-label="Otros compañeros"></div>
      <div class="field"><span class="lbl">Modalidad</span>
        <div class="chips" id="mod">${MODALIDADES.map(m => `<button type="button" class="chip ${((s.modalidad || '') === m || (!s.modalidad && m === 'Monte a pie')) ? 'on' : ''}" data-m="${esc(m)}">${esc(m)}</button>`).join('')}</div></div>
      <details class="more-fields" ${ed ? 'open' : ''}><summary>Más datos (sierra, salida, notas…)</summary><div>
        <div class="two">
          <div class="field"><label for="fSierra">Sierra</label><input id="fSierra" value="${esc(s.sierra || '')}"></div>
          <div class="field"><label for="fProv">Provincia</label><input id="fProv" list="provs" value="${esc(s.provincia || '')}"><datalist id="provs">${(S.listas?.provincias || []).map(p => `<option value="${esc(p)}">`).join('')}</datalist></div>
        </div>
        <div class="field"><label for="fSalida">Punto de partida</label><input id="fSalida" placeholder="De…" value="${esc(s.salida || '')}"></div>
        <div class="two">
          <div class="field"><label for="fFin">Fecha fin (si fueron varios días)</label><input id="fFin" type="date" value="${esc(s.fechaFin || '')}"></div>
          <div class="field"><label for="fRuta">ID de ruta</label><input id="fRuta" inputmode="numeric" value="${esc(s.idRuta || '')}"></div>
        </div>
        <div class="field"><label for="fNotas">Notas</label><textarea id="fNotas" rows="3">${esc(s.notas || '')}</textarea></div>
      </div></details>
      <div id="fErr" class="confirm" hidden></div>
      <button class="btn primary wide" type="submit">${ed ? 'Guardar cambios' : 'Guardar salida'}</button>
      ${ed ? '<button class="btn wide" type="button" id="fCancel">Cancelar</button>' : ''}
    </form></div>`;
  let modalidad = s.modalidad || '';
  const tocadoMod = { v: !!s.modalidad };
  document.querySelectorAll('#comp .chip').forEach(b => b.onclick = () => { b.classList.toggle('on'); b.setAttribute('aria-pressed', b.classList.contains('on')); guardarBorrador(); });
  document.querySelectorAll('#mod .chip').forEach(b => b.onclick = () => {
    document.querySelectorAll('#mod .chip').forEach(x => x.classList.remove('on')); b.classList.add('on'); modalidad = b.dataset.m; tocadoMod.v = true; guardarBorrador();
  });
  const monte = $('#fMonte');
  const nombres = [...REF.values()].sort((a, b) => b.veces - a.veces);
  function sugerir() {
    const q = sinTildes(monte.value);
    const box = $('#sug');
    if (q.length < 2) { box.innerHTML = ''; return; }
    const m = nombres.filter(r => sinTildes(r.nombre).includes(q)).slice(0, 5);
    if (m.length === 1 && sinTildes(m[0].nombre) === q) { box.innerHTML = ''; return; }
    box.innerHTML = m.map(r => `<button type="button" data-c="${esc(r.nombre)}">${esc(proper(r.nombre))} <span>· ${r.veces} ${r.veces === 1 ? 'vez' : 'veces'}${r.alt ? ' · ' + fmtN(r.alt) + ' m' : ''}</span></button>`).join('');
    box.querySelectorAll('button').forEach(b => b.onclick = () => { monte.value = proper(b.dataset.c); box.innerHTML = ''; autorrellenar(true); monte.focus(); });
  }
  let ultimaCumbre = null;
  function autorrellenar(forzar) {
    const c = cumbreDe(monte.value); const r = REF.get(c);
    const hecho = [];
    if (r) {
      if (r.cota && (!$('#fCotas').value || forzar && !ed)) { if (!$('#fCotas').value) { $('#fCotas').value = r.cota; hecho.push('cota'); } }
      if (r.sierra && !$('#fSierra').value) { $('#fSierra').value = r.sierra; hecho.push('sierra'); }
      if (r.prov && !$('#fProv').value) { $('#fProv').value = r.prov; hecho.push('provincia'); }
      if (r.salida && !$('#fSalida').value) { $('#fSalida').value = r.salida; hecho.push('salida'); }
      if (hecho.length) $('#auto').textContent = `✓ Puesto como la última vez: ${hecho.join(', ')}. Estuviste aquí el ${fCorta(r.ultima)}.`;
      else if (ultimaCumbre !== c) $('#auto').textContent = `Estuviste aquí el ${fCorta(r.ultima)} (${r.veces} ${r.veces === 1 ? 'vez' : 'veces'}).`;
    } else $('#auto').textContent = '';
    ultimaCumbre = c;
    if (!tocadoMod.v) {
      const m = modalidadDe({ monte: monte.value });
      document.querySelectorAll('#mod .chip').forEach(x => x.classList.toggle('on', x.dataset.m === m));
      modalidad = m === 'Monte a pie' ? '' : m;
    }
  }
  monte.addEventListener('input', () => { sugerir(); guardarBorrador(); });
  monte.addEventListener('change', () => autorrellenar(false));
  monte.addEventListener('blur', () => setTimeout(() => autorrellenar(false), 150));
  $('#f').addEventListener('input', guardarBorrador);
  if (ed) $('#fCancel').onclick = () => irA('buscar');

  function leer() {
    const elegidos = [...document.querySelectorAll('#comp .chip.on')].map(b => b.dataset.n);
    nombresDe($('#fOtros').value).forEach(n => { if (!elegidos.includes(n)) elegidos.push(n); });
    const cot = cotasDe([$('#fCotas').value]);
    const km = num($('#fKm').value);
    const o = {
      id: ed ? ed.id : 'S' + Date.now().toString(36).toUpperCase() + Math.random().toString(36).slice(2, 5).toUpperCase(),
      fecha: $('#fFecha').value, fechaFin: $('#fFin').value, monte: monte.value.trim().toUpperCase(),
      sierra: $('#fSierra').value.trim(), provincia: provDe($('#fProv').value), km: km == null ? '' : km,
      salida: $('#fSalida').value.trim(), participantes: elegidos.join(', '), modalidad: modalidad,
      idRuta: $('#fRuta').value.trim(), notas: $('#fNotas').value.trim()
    };
    for (let i = 0; i < 5; i++) o['cota' + (i + 1)] = cot[i] || '';
    return o;
  }
  function guardarBorrador() { if (ed) return; const o = leer(); o.cotasTxt = $('#fCotas').value; store.set('borrador', o); }
  $('#f').addEventListener('submit', e => {
    e.preventDefault();
    autorrellenar(false);
    const o = leer(); const err = [];
    if (!o.fecha) err.push('Falta la fecha.');
    if (!o.monte) err.push('Falta el monte o la ruta.');
    if (err.length) { const b = $('#fErr'); b.hidden = false; b.innerHTML = err.join('<br>'); b.scrollIntoView({ block: 'center' }); return; }
    const nueva = enriquecer(Object.assign({}, o, { _local: true }));
    if (ed) S.salidas = S.salidas.map(x => x.id === ed.id ? nueva : x); else S.salidas.unshift(nueva);
    recalcular();
    encolar({ accion: ed ? 'editar' : 'crear', salida: o });
    if (!ed) store.set('borrador', null);
    toast(ed ? 'Cambios guardados' : 'Salida guardada');
    irA('buscar', '');
  });
  if (!ed && borrador) $('#auto').textContent = 'Tenías una salida a medias: la hemos recuperado.';
}

/* ---- Montes ---- */
let montesOrden = 'veces', montesQ = '';
function vMontes() {
  const all = [...REF.values()].filter(r => r.nombre);
  $('#app').innerHTML = `<div class="view">
    <h2>Mis montes <span class="muted small">· ${all.length}</span></h2>
    <div class="search"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
      <input id="mq" type="search" placeholder="Filtrar montes…" aria-label="Filtrar montes" value="${esc(montesQ)}"></div>
    <div class="chips">${[['veces', 'Más subidos'], ['ultima', 'Recientes'], ['nombre', 'A–Z'], ['alt', 'Más altos']].map(([k, t]) => `<button type="button" class="chip ${montesOrden === k ? 'on' : ''}" data-o="${k}">${t}</button>`).join('')}</div>
    <div id="ml"></div></div>`;
  const pinta = () => {
    const q = sinTildes(montesQ);
    let l = all.filter(r => !q || sinTildes(r.nombre).includes(q) || sinTildes(r.sierra).includes(q));
    const by = { veces: (a, b) => b.veces - a.veces, ultima: (a, b) => (b.ultima || '').localeCompare(a.ultima || ''), nombre: (a, b) => a.nombre.localeCompare(b.nombre, 'es'), alt: (a, b) => (b.alt || 0) - (a.alt || 0) }[montesOrden];
    l.sort(by);
    $('#ml').innerHTML = l.slice(0, 300).map(r => `<button type="button" class="mrow" data-c="${esc(r.nombre)}">
      <span class="n">${esc(proper(r.nombre))}</span><span class="c">${r.veces}</span>
      <span class="s">${[r.alt ? fmtN(r.alt) + ' m' : '', r.sierra, 'última ' + fCorta(r.ultima)].filter(Boolean).map(esc).join(' · ')}</span></button>`).join('') || '<div class="empty">Ningún monte con ese nombre.</div>';
    document.querySelectorAll('.mrow').forEach(b => b.onclick = () => irA('buscar', proper(b.dataset.c)));
  };
  pinta();
  $('#mq').addEventListener('input', e => { montesQ = e.target.value; pinta(); });
  document.querySelectorAll('[data-o]').forEach(b => b.onclick = () => { montesOrden = b.dataset.o; vMontes(); });
}

/* ---- Resumen ---- */
let anioSel = String(new Date().getFullYear());
function vResumen() {
  const anios = [...new Set(S.salidas.map(s => (s.fecha || '').slice(0, 4)).filter(Boolean))].sort().reverse();
  if (!anios.includes(anioSel) && anioSel !== 'todos') anioSel = anios[0] || 'todos';
  const sel = S.salidas.filter(s => s.mod !== 'Evento' && (anioSel === 'todos' || (s.fecha || '').startsWith(anioSel)));
  const cumbres = sel.reduce((a, s) => a + s.cotas.length, 0);
  const km = sel.reduce((a, s) => a + (num(s.km) || 0), 0);
  const alto = sel.reduce((m, s) => (s.altMax || 0) > (m?.altMax || 0) ? s : m, null);
  const meses = Array(12).fill(0); sel.forEach(s => { if (s.fecha) meses[+s.fecha.slice(5, 7) - 1]++; });
  const mx = Math.max(1, ...meses);
  const cuenta = f => { const m = new Map(); sel.forEach(s => f(s).forEach(k => m.set(k, (m.get(k) || 0) + 1))); return [...m].sort((a, b) => b[1] - a[1]).slice(0, 6); };
  const topM = cuenta(s => [s.cumbre]); const topC = cuenta(s => s.nombres.filter(n => n !== S.listas?.propietario));
  const rank = arr => { const m = arr[0]?.[1] || 1; return arr.map(([n, c]) => `<div><span>${esc(n)}</span><b>${c}</b><span class="meter"><i style="width:${(c / m * 100).toFixed(0)}%"></i></span></div>`).join(''); };
  let comparar = '';
  if (anioSel === String(new Date().getFullYear())) {
    const hoy = hoyISO().slice(5); const prev = String(+anioSel - 1);
    const n = S.salidas.filter(s => (s.fecha || '').startsWith(prev) && s.fecha.slice(5) <= hoy && s.mod !== 'Evento').length;
    comparar = `<p class="muted small">El año pasado a estas alturas llevabas ${n} salidas.</p>`;
  }
  $('#app').innerHTML = `<div class="view">
    <h2>Resumen</h2>
    <div class="field"><label for="anio">Año</label><select id="anio"><option value="todos">Todos los años</option>${anios.map(a => `<option ${a === anioSel ? 'selected' : ''}>${a}</option>`).join('')}</select></div>
    <div class="kpis">
      <div class="kpi"><div class="v">${sel.length}</div><div class="k">Salidas</div></div>
      <div class="kpi"><div class="v">${cumbres}</div><div class="k">Cumbres</div></div>
      <div class="kpi"><div class="v">${fmtN(Math.round(km))}</div><div class="k">Km anotados</div></div>
      <div class="kpi"><div class="v">${alto ? fmtN(alto.altMax) : '—'}</div><div class="k">Cota más alta${alto ? ' · ' + esc(proper(alto.cumbre)) : ''}</div></div>
    </div>${comparar}
    <section class="panel"><h3>Salidas por mes</h3>
      <div class="bars">${meses.map(v => `<div class="bar" style="height:${(v / mx * 100).toFixed(1)}%"><span>${v || ''}</span></div>`).join('')}</div>
      <div class="bars-l">${MESES.map(m => `<span>${m}</span>`).join('')}</div></section>
    <section class="panel"><h3>Montes más repetidos</h3><div class="rank">${rank(topM.map(([n, c]) => [proper(n), c]))}</div></section>
    <section class="panel"><h3>Con quién más</h3><div class="rank">${rank(topC)}</div></section>
    <section class="panel"><h3>Excel</h3>
      <p class="small muted" style="margin:0">Descarga las salidas con las mismas columnas que la hoja Datos (A–P) para pegarlas en tu Excel.</p>
      <div class="field"><label for="exDesde">Salidas desde</label><input id="exDesde" type="date" value="${esc(store.get('ultimoExport', ''))}"><span class="hint">Déjalo vacío para descargarlas todas.</span></div>
      <button type="button" class="btn fir" id="exBtn">Descargar Excel</button></section>
    <button type="button" class="btn" id="goAjustes">Ajustes y conexión</button>
  </div>`;
  $('#anio').onchange = e => { anioSel = e.target.value; vResumen(); };
  $('#exBtn').onclick = exportar;
  $('#goAjustes').onclick = () => irA('ajustes');
}

/* ---- Exportar ---- */
function cargarScript(src) { return new Promise((ok, ko) => { if (window.XLSX) return ok(); const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = ko; document.head.appendChild(s); }); }
async function exportar() {
  if (S.demo) { toast('En la versión de prueba no se puede descargar. En la app real sí.'); return; }
  try { await cargarScript('https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js'); }
  catch (e) { toast('Hace falta conexión para preparar el Excel.'); return; }
  const desde = $('#exDesde').value;
  const filas = [...S.salidas].filter(s => !desde || (s.fecha || '') >= desde).sort((a, b) => (a.fecha || '').localeCompare(b.fecha || ''));
  const d = iso => iso ? fParts(iso).dt : '';
  const cab = ['FECHA', 'FECHA FIN\n(varios días)', 'MONTE / RUTA', 'SIERRA', 'PROVINCIA', 'COTA 1\n(m)', 'COTA 2\n(m)', 'COTA 3\n(m)', 'COTA 4\n(m)', 'COTA 5\n(m)', 'KM', 'PUNTO DE PARTIDA', 'PARTICIPANTES\n(nombres separados por coma)', 'MODALIDAD\n(solo si no se detecta)', 'ID RUTA', 'NOTAS'];
  const data = [cab].concat(filas.map(s => [d(s.fecha), d(s.fechaFin), s.monte, s.sierra, s.provincia, s.cota1, s.cota2, s.cota3, s.cota4, s.cota5, num(s.km) ?? '', s.salida, s.participantes, s.modalidad, s.idRuta, s.notas]));
  const ws = XLSX.utils.aoa_to_sheet(data, { cellDates: true, dateNF: 'dd/mm/yyyy' });
  ws['!cols'] = [12, 12, 40, 16, 12, 8, 8, 8, 8, 8, 7, 26, 50, 14, 12, 30].map(w => ({ wch: w }));
  const wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, ws, 'Datos');
  XLSX.writeFile(wb, `Mendiak_salidas_${hoyISO()}.xlsx`);
  store.set('ultimoExport', hoyISO());
  toast(`Descargadas ${filas.length} salidas`);
}

/* ---- Ajustes ---- */
function vAjustes() {
  $('#app').innerHTML = `<div class="view">
    <h2>Ajustes</h2>
    <section class="panel"><h3>Conexión con Google</h3>
      <p class="small muted" style="margin:0">Normalmente se configura sola al abrir el enlace de instalación. Solo hace falta tocar esto si cambia.</p>
      <div class="field"><label for="aUrl">Dirección del script</label><input id="aUrl" value="${esc(S.cfg?.url || '')}" placeholder="https://script.google.com/macros/s/…/exec"></div>
      <div class="field"><label for="aK">Clave</label><input id="aK" value="${esc(S.cfg?.k || '')}"></div>
      <div class="row"><button type="button" class="btn fir" id="aSave">Guardar y actualizar</button><button type="button" class="btn" id="aSync">Actualizar ahora</button></div>
      <p class="small muted" style="margin:0">${S.ultimaSync ? 'Última actualización: ' + S.ultimaSync.toLocaleString('es-ES') : ''}${S.pend.length ? ' · ' + S.pend.length + ' cambios por enviar' : ''}</p>
    </section>
    <button type="button" class="btn" id="aBack">Volver</button></div>`;
  $('#aSave').onclick = () => { S.cfg = { url: $('#aUrl').value.trim(), k: $('#aK').value.trim() }; store.set('cfg', S.cfg); sincronizar(true); };
  $('#aSync').onclick = () => sincronizar(true);
  $('#aBack').onclick = () => irA('resumen');
}

/* ====================== arranque ====================== */
document.querySelectorAll('nav.tabs button').forEach(b => b.onclick = () => { if (b.dataset.tab === 'nueva' && S.tab === 'nueva') return; irA(b.dataset.tab); });
$('#syncPill').onclick = () => S.demo ? toast('Versión de prueba: no se conecta a Google.') : (S.cfg ? sincronizar(true) : irA('ajustes'));
window.addEventListener('online', () => sincronizar());
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') sincronizar(); });

function arrancar() {
  if (window.MENDIAK_DEMO) {
    S.demo = true; $('#demoBanner').hidden = false;
    S.listas = window.MENDIAK_DEMO.listas; prepararListas();
    S.salidas = window.MENDIAK_DEMO.salidas.map(deFila);
  } else {
    leerConfigDeEnlace();
    S.pend = store.get('pend', []);
    const c = store.get('cache', null);
    if (c) { S.listas = c.listas; prepararListas(); S.salidas = c.salidas.map(deFila); }
    else prepararListas();
    // lo pendiente de enviar se ve ya en la lista
    S.pend.forEach(op => {
      if (op.accion === 'crear' && !S.salidas.some(x => x.id === op.salida.id)) S.salidas.push(enriquecer(Object.assign({ _local: true }, op.salida)));
      if (op.accion === 'editar') S.salidas = S.salidas.map(x => x.id === op.salida.id ? enriquecer(Object.assign({ _local: true }, op.salida)) : x);
      if (op.accion === 'borrar') S.salidas = S.salidas.filter(x => x.id !== op.id);
    });
    if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  }
  recalcular(); render();
  if (!S.demo) { if (S.cfg) sincronizar(); else if (!S.salidas.length) irA('ajustes'); }
}
arrancar();
</script>
</body>
